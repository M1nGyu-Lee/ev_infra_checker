[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#ECFDF5"
textColor = "#0F172A"
linkColor = "#0F766E"
borderColor = "#CBD5E1"
showWidgetBorder = true
baseRadius = "0.75rem"
font = "sans-serif"
chartCategoricalColors = ["#0F766E", "#2563EB", "#D97706", "#7C3AED", "#DC2626", "#0891B2"]

[client]
showErrorDetails = "full"
toolbarMode = "viewer"

[server]
headless = true
