[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F0FDFA"
textColor = "#0F172A"
linkColor = "#0F766E"
borderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "0.85rem"
font = "sans-serif"
headingFontWeights = [600, 700, 700, 700, 700, 700]
chartCategoricalColors = [
  "#0F766E",
  "#2563EB",
  "#D97706",
  "#DC2626",
  "#0891B2",
  "#475569",
]

[client]
showErrorDetails = "full"
toolbarMode = "viewer"

[server]
headless = true
